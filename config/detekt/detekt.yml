config:
  validation: true

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable

  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'

complexity:
  LongParameterList:
    ignoreDefaultParameters: true

  TooManyFunctions:
    ignoreAnnotatedFunctions:
      - Preview

style:
  MagicNumber:
    ignorePropertyDeclaration: true

potentialbugs:
  UnusedPrivateFunction:
    ignoreAnnotated:
      - Preview
